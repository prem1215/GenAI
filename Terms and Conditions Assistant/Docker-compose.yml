version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tosai
      - BROKER_URL=redis://redis:6379/0
      - GROQ_API_KEY=your_groq_api_key
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A celery_worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tosai
      - BROKER_URL=redis://redis:6379/0
      - GROQ_API_KEY=your_groq_api_key
    depends_on:
      - backend
      - redis

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tosai
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
